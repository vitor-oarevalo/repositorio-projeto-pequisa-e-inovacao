<!DOCTYPE html>
<html lang="ptBR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Financeiro</title>
</head>
<body>
    <h1>Simulador financeiro</h1>
    <h2>Estime o impacto financeiro de falhas por superaquecimento e o potencial de economia utilizando o sistema MaqTemp.</h2>
    <br>
    <label>Quantidade de motores:</label>
    <input placeholder="quantidade de motores" type="number" id="input_quantidade" value ="5">
    <br>
    <button onclick="calcular()">Calcular</button>
    <br>
    <br>
    <div>Considerando que um motor novo custa R$12.000, prejuízo por hora parada de R$4.600, parada de 12 horas e custo de manutenção preventiva de R$4.000.</div>
    <br>
    <div id="div_exibir"></div>
    
</body>
</html>
<script>
    let motor = 12000;
    let custoProducaoParada = 4600;
    let duracaoParada = 12;
    let custoManutencao = 4000;
    let custoSistema = 1000;

    function calcular(){
        let quantidade = Number(input_quantidade.value);

        let prejuizo = (custoProducaoParada * duracaoParada) + motor;
        let monitorado = (custoProducaoParada * 2) + custoManutencao; //parada apenas para manutenção
        let economia = prejuizo - monitorado;
        div_exibir.innerHTML = `<h3>Aquecimento em 1 motor</h3> Sem o nosso produto: R$${prejuizo} de prejuízo <br> Com o nosso produto: R$${monitorado} de prejuízo (considerando parada de 2 horas para manutenção + custo de manutenção) <br> Economia: R$${economia} <br><br> Custo da nossa solução nas ${quantidade} máquinas: R$${custoSistema*quantidade} <br> Com apenas ${(custoSistema*quantidade/prejuizo*100).toFixed(0)}% do custo de 1 prejuizo você recupera o valor da nossa solução.`;
    }
</script>
